[package]
name = "readers-exit"
description = "readersEXIT: limit orders and DCA for NEAR memecoins, executed on Ref Finance"
version = "0.1.0"
edition = "2021"
# Exposed via the `contract_source_metadata` view (NEP-330) for source verification.
repository = "https://github.com/Skytonet2/readersexit"

[lib]
crate-type = ["cdylib", "rlib"]

# Reproducible (verifiable) builds: `cargo near build reproducible-wasm` builds inside this
# pinned image, so anyone can rebuild the exact deployed wasm from a commit (NEP-330).
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
# The tag above is descriptive only; the image is identified by this digest.
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "5.29"
uint = { version = "0.10", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

